[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "structura-edit"
version = "0.1.0a1"
description = "Transactional Minecraft schematic editing with an optional desktop workbench"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["structura-core>=0.6,<0.7", "PyMCTranslate>=1.2.38,<2"]

[project.optional-dependencies]
world = ["structura-core[world]>=0.6,<0.7"]
gui = [
  "structura-core[world,legacy,bedrock]>=0.6,<0.7",
  "structura-render[hero]>=0.8,<0.9",
  "PySide6-Essentials>=6.8,<6.9",
  "pyvistaqt>=0.11,<0.12",
]
test = ["pytest>=8,<9"]

[project.scripts]
structura-edit = "structura_edit.__main__:main"

[project.urls]
Repository = "https://github.com/kirimba1024/structura-edit"
Issues = "https://github.com/kirimba1024/structura-edit/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
structura_edit = ["py.typed", "data/*.qss", "data/*.svg", "data/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
