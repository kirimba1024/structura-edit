name: Verify installed editor

on:
  push:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install build twine
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PYTHON'
          import os, pathlib, tomllib
          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          tag = os.environ.get("RELEASE_TAG")
          if tag:
              assert tag == f"v{version}", (tag, version)
          PYTHON
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python: "3.9"
          - os: ubuntu-22.04
            python: "3.11"
          - os: macos-14
            python: "3.11"
          - os: windows-2022
            python: "3.11"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      STRUCTURA_EDIT_DATA: ${{ github.workspace }}/.test-data/edit
      AMULET_LEVEL_CACHE_DIR: ${{ github.workspace }}/.test-data/amulet
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install Windows software OpenGL
        if: runner.os == 'Windows'
        uses: pyvista/setup-headless-display-action@9c1c7435d9635423c90d2c37489588c81673274a
        with:
          pyvista: false
          mesa3d-release: "24.3.0"
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Install Linux display libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0
      - name: Install built wheel and checks
        run: |
          python -m pip install ruff==0.13.3
          python - <<'PYTHON'
          import pathlib, subprocess, sys
          wheel = next(pathlib.Path("dist").glob("*.whl"))
          subprocess.check_call([sys.executable, "-m", "pip", "install", f"{wheel}[gui,test,typing]"])
          PYTHON
          python -m pip check
      - name: Verify installed package locations and dependencies
        run: |
          python - <<'PYTHON'
          import importlib.metadata
          import structura_core, structura_render, structura_edit
          from structura_core.block_array import BlockArray
          from structura_core.world_backup import restore_backup
          from structura_render.packets import lod_packets, polygon_packets
          from structura_render.lod_geometry import spatially_order_lod
          from structura_render.lod_rectangles import merge_rectangles
          for module in (structura_core, structura_render, structura_edit):
              assert "site-packages" in module.__file__, module.__file__
              assert module.__version__ == importlib.metadata.version(module.__name__.replace("_", "-"))
          PYTHON
      - run: python -m ruff check src tests
      - run: python -m mypy
      - name: Test on Linux
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a -s '-screen 0 1920x1080x24' python -m pytest -q tests --junitxml=pytest-results.xml
      - name: Test on macOS and Windows
        if: runner.os != 'Linux'
        run: python -m pytest -q tests --junitxml=pytest-results.xml
      - name: Preserve test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tests-${{ matrix.os }}-py${{ matrix.python }}
          path: pytest-results.xml
